name: CI

on:
  push:
    branches: [main]
    tags-ignore:
      - "**"
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.3"
          enable-cache: true
          # Same key as test (ubuntu) so we can restore what test saved;
          # do not save here or we race the concurrent test matrix cell.
          cache-suffix: ${{ github.workflow }}
          save-cache: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --group dev

      - name: Ensure OpenColorIO 2.5+ linkage
        run: uv run python scripts/ensure_ocio.py

      - name: Ruff check
        run: uv run ruff check src/ main.py tests/

      - name: Ruff format check
        run: uv run ruff format --check src/ main.py tests/

  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.3"
          enable-cache: true
          # Separate from Release workflow jobs so concurrent CI+Release
          # runs don't fight over the same cache key (noisy annotations).
          cache-suffix: ${{ github.workflow }}
          prune-cache: true

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install Qt offscreen system libs (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3

      - name: Install dependencies
        run: uv sync --group dev

      - name: Ensure OpenColorIO 2.5+ linkage
        run: uv run python scripts/ensure_ocio.py

      - name: Run full test suite (unit + integration)
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        # Full suite — including @pytest.mark.integration. Missing optional
        # manifest media is skipped, not failed.
        run: uv run pytest -v

  # Single aggregate check used by branch protection / required status.
  ci-ok:
    if: always()
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - name: Require lint + all test matrix jobs green
        shell: bash
        run: |
          echo "lint=${{ needs.lint.result }}"
          echo "test=${{ needs.test.result }}"
          if [ "${{ needs.lint.result }}" != "success" ]; then
            echo "Lint failed" >&2
            exit 1
          fi
          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "Tests failed" >&2
            exit 1
          fi
          echo "CI gate passed"
